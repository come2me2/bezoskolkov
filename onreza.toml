#:schema https://raw.githubusercontent.com/ONREZA/nrz-cli/main/onreza.schema.json

[project]
name = "bezoskolkov"

[build]
command = "npm run build"
output_dirs = [".next"]

[deploy]
compute = "process"
entry = ".next/standalone/server.js"

[env.declarations]
# На ONREZA используйте Яндекс SMTP (smtp.yandex.ru:465), не Gmail.
SMTP_HOST = { visibility = "sensitive", required = true }
SMTP_PORT = { visibility = "plain", required = false }
SMTP_USER = { visibility = "sensitive", required = true }
SMTP_PASS = { visibility = "sensitive", required = true }
SMTP_FROM = { visibility = "plain", required = false }
LEAD_TO = { visibility = "plain", required = false }
TELEGRAM_BOT_TOKEN = { visibility = "sensitive", required = false }
TELEGRAM_CHAT_ID = { visibility = "sensitive", required = false }
