#:schema https://docs.onreza.ru/schemas/onreza-project-v1.schema.json

[project]
name = "bezoskolkov"
framework = "next"

[build]
command = "npm run build"
output_dirs = [".next"]

[deploy]
compute = "process"
entry = ".next/standalone/server.js"

[env.declarations]
# Основной канал на ONREZA: Cloudflare Worker → Telegram
LEAD_WEBHOOK_URL = { visibility = "plain", required = false }
LEAD_WEBHOOK_SECRET = { visibility = "sensitive", required = false }
TELEGRAM_BOT_TOKEN = { visibility = "sensitive", required = false }
TELEGRAM_CHAT_ID = { visibility = "sensitive", required = false }
SMTP_HOST = { visibility = "sensitive", required = false }
SMTP_PORT = { visibility = "plain", required = false }
SMTP_USER = { visibility = "sensitive", required = false }
SMTP_PASS = { visibility = "sensitive", required = false }
SMTP_FROM = { visibility = "plain", required = false }
LEAD_TO = { visibility = "plain", required = false }
LEAD_TRY_SMTP = { visibility = "plain", required = false }
